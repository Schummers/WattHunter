name: Resolve Auction Rounds

on:
  schedule:
    - cron: '5 23 * * *'   # 23:05 UTC = 00:05 CET (hiver) / 01:05 CEST (été)
  workflow_dispatch:         # trigger manuel

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pcs-sync
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: pip install supabase python-dotenv
      - run: python3 resolve_now.py
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
