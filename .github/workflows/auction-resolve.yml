# .github/workflows/auction-resolve.yml
name: Auction Resolution (Midnight)

on:
  schedule:
    - cron: '0 0 * * *'  # 00:00 UTC every day
  workflow_dispatch:

jobs:
  resolve:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pcs-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/pcs-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Resolve auction round
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONVERSION_RATE_EUR_PER_PCS: ${{ secrets.CONVERSION_RATE_EUR_PER_PCS }}
        run: python run_auction_resolve.py
        # Returns {"status": "no_open_auctions"} if nothing to resolve — this is OK
