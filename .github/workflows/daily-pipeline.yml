# .github/workflows/daily-pipeline.yml
name: Daily Pipeline (Sync + Scoring)

on:
  schedule:
    - cron: '0 8 * * *'  # 08:00 UTC every day
  workflow_dispatch:        # Allow manual trigger

jobs:
  daily-pipeline:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: services/pcs-sync
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: services/pcs-sync/requirements.txt

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Install Playwright Chromium
        run: playwright install chromium --with-deps

      - name: Run daily pipeline
        env:
          SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
          CONVERSION_RATE_EUR_PER_PCS: ${{ secrets.CONVERSION_RATE_EUR_PER_PCS }}
          PCS_RATE_LIMIT_DELAY_MS: ${{ secrets.PCS_RATE_LIMIT_DELAY_MS }}
        run: python run_daily_pipeline.py
